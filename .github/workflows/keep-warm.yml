# Render's free plan puts the backend to sleep after 15 minutes without traffic, and waking
# it takes about a minute. This pings it every 10 minutes during Singapore office hours on
# weekdays (01:00-10:00 UTC), about 220 hours a month, well inside Render's 750 free hours.
#
# Set the repository variable BACKEND_URL (Settings → Secrets and variables → Actions →
# Variables), e.g. https://hoshiyar-api.onrender.com. Disable this workflow when not needed.
name: Keep backend warm

on:
  schedule:
    - cron: "*/10 1-10 * * 1-5"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    if: ${{ vars.BACKEND_URL != '' }}
    steps:
      - run: curl -fsS --max-time 90 "${{ vars.BACKEND_URL }}/api/health" > /dev/null || true
