<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Hoshiyar settings</title>
    <link rel="stylesheet" href="popup.css" />
    <style>
      body { width: auto; max-width: 560px; margin: 24px auto; padding: 24px; border-radius: 18px; }
      .row { margin-bottom: 14px; }
      input[type="text"], select { width: 100%; background: #081b18; color: #e7eee6; border: 1px solid rgba(231,238,230,.14);
        border-radius: 10px; padding: 9px 11px; font: inherit; }
      .check { display: flex; gap: 8px; align-items: flex-start; font-weight: 400; }
      #saved { color: #5ccfa5; margin-left: 8px; }
    </style>
  </head>
  <body>
    <header><img src="icons/icon-32.png" width="22" height="22" alt="" /><strong>Hoshiyar settings</strong></header>
    <div class="row">
      <label for="apiUrl">Hoshiyar server (API) address</label>
      <input id="apiUrl" type="text" placeholder="https://hoshiyar-api.onrender.com" />
      <p class="hint">Render addresses (*.onrender.com) and localhost work straight away. For another address Chrome asks for permission once.</p>
    </div>
    <div class="row">
      <label for="appUrl">Website address (optional)</label>
      <input id="appUrl" type="text" placeholder="https://hoshiyar.vercel.app" />
    </div>
    <div class="row">
      <label for="integrationKey">Integration key (only if the server uses a captcha)</label>
      <input id="integrationKey" type="text" placeholder="INTEGRATION_KEY from the server settings" />
    </div>
    <div class="row">
      <label for="language">Reply language</label>
      <select id="language">
        <option value="en">English</option>
        <option value="ur">اردو</option>
        <option value="roman">Roman Urdu</option>
      </select>
    </div>
    <div class="row">
      <label class="check"><input id="banner" type="checkbox" /> Warn me on look-alike bank, wallet and government sites (checked inside the browser; nothing is sent)</label>
    </div>
    <button id="save" type="button">Save</button><span id="saved" hidden>Saved</span>
    <script src="settings.js"></script>
    <script src="options.js"></script>
  </body>
</html>
